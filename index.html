<body>
<title>LocaLink Prototype</title>

<style>
/* Layout: one phone-sized app column (customer / worker / admin) centred on a quiet field; role switch on top, tab bar at the bottom. */
:root{
  --bg:#E9F0F0; --surface:#FFFFFF; --ink:#12272B; --muted:#546C71; --line:#D3E0E1;
  --brand:#0F5C63; --brand-ink:#FFFFFF; --chip:#E3EEEF; --accent:#E8912D;
  --ok:#1B7A4B; --warn:#9A6212; --bad:#B0372E;
  --ok-bg:#DDF1E6; --warn-bg:#FBEBCF; --bad-bg:#F9DEDB;
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'Figtree','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1517; --surface:#12262A; --ink:#E4F0F1; --muted:#9DB5B8; --line:#25434A;
  --brand:#46B4BD; --brand-ink:#06181A; --chip:#1A363B; --accent:#F0A64F;
  --ok:#52C98F; --warn:#E6B255; --bad:#F2857B;
  --ok-bg:#15382A; --warn-bg:#3B2E14; --bad-bg:#40211E; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0A1517; --surface:#12262A; --ink:#E4F0F1; --muted:#9DB5B8; --line:#25434A;
  --brand:#46B4BD; --brand-ink:#06181A; --chip:#1A363B; --accent:#F0A64F;
  --ok:#52C98F; --warn:#E6B255; --bad:#F2857B;
  --ok-bg:#15382A; --warn-bg:#3B2E14; --bad-bg:#40211E; color-scheme:dark;}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px}
h1,h2,h3{font-family:var(--font-display);margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:22px} h2{font-size:17px} h3{font-size:15px}
p{margin:0}
button,select,input,textarea{font:inherit;color:inherit}
.muted{color:var(--muted)} .small{font-size:13px}
.wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:700;font-size:22px;color:var(--brand)}
.tag{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--chip);color:var(--muted)}
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;background:var(--chip);border-radius:12px}
.roles button{border:0;background:transparent;padding:9px 6px;border-radius:9px;font-weight:600;color:var(--muted);cursor:pointer}
.roles button[aria-selected="true"]{background:var(--surface);color:var(--brand);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.phone{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;min-height:560px}
.screen{padding:18px 16px 24px;display:flex;flex-direction:column;gap:14px;flex:1}
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border-top:1px solid var(--line);background:var(--surface);position:sticky;bottom:0}
.tabs button{border:0;background:transparent;padding:13px 4px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer;border-top:3px solid transparent}
.tabs button[aria-selected="true"]{color:var(--brand);border-top-color:var(--brand)}
.count{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:99px;background:var(--accent);color:#2A1700;font-size:11px;line-height:18px;text-align:center}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
select,input[type=text],input[type=password],textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font-weight:500}
textarea{min-height:64px;resize:vertical}
.lbl{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);padding:7px 11px;border-radius:99px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.slots .chip{border-radius:10px;text-align:center;padding:8px 4px;font-size:12px;line-height:1.25}
.slots .chip small{display:block;font-weight:500;opacity:.8}
.btn{border:0;border-radius:11px;padding:12px 14px;font-weight:700;cursor:pointer;background:var(--brand);color:var(--brand-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.bad{background:var(--bad-bg);color:var(--bad)}
.btn.ok{background:var(--ok-bg);color:var(--ok)}
.btn.sm{padding:8px 11px;font-size:13px;border-radius:9px}
.btn:focus-visible,.chip:focus-visible,.tabs button:focus-visible,.roles button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.card{border:1px solid var(--line);border-radius:14px;padding:13px;display:flex;flex-direction:column;gap:10px;min-width:0}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--chip);color:var(--brand);display:grid;place-items:center;font-family:var(--font-display);font-weight:700;flex:none}
.score{text-align:center;flex:none}
.score b{display:block;font-family:var(--font-display);font-size:26px;line-height:1;color:var(--brand)}
.score span{font-size:11px;color:var(--muted);font-weight:600}
.pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--chip);color:var(--muted)}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--muted)}
details{border-top:1px dashed var(--line);padding-top:8px}
summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--brand)}
.bars{display:flex;flex-direction:column;gap:7px;margin-top:8px}
.bar{display:grid;grid-template-columns:92px 1fr 44px;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.bar i{display:block;height:7px;border-radius:99px;background:var(--chip);overflow:hidden}
.bar i u{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar b{text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
.weights{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--chip)}
.weights details{border:0;padding:0}
.wrow{display:grid;grid-template-columns:96px 1fr 38px;gap:8px;align-items:center;font-size:12px;margin-top:8px}
.wrow input{width:100%;accent-color:var(--brand)}
.wrow b{text-align:right;font-variant-numeric:tabular-nums}
.formula{font-size:12px;color:var(--muted);margin-top:8px}
.track{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted)}
.track span{display:flex;align-items:center;gap:5px}
.track span::before{content:"";width:10px;height:10px;border-radius:50%;border:2px solid var(--line);background:var(--surface)}
.track span.on{color:var(--ink)} .track span.on::before{background:var(--brand);border-color:var(--brand)}
.track hr{flex:1;border:0;border-top:2px solid var(--line);margin:0;min-width:10px}
.stars{display:flex;gap:4px}
.stars .chip{padding:6px 10px}
.empty{padding:26px 12px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}
.back{border:0;background:none;color:var(--brand);font-weight:700;cursor:pointer;padding:0;align-self:flex-start}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--chip);border-radius:12px;padding:10px;text-align:center}
.stats b{display:block;font-family:var(--font-display);font-size:19px}
.stats span{font-size:11px;color:var(--muted);font-weight:600}
.note{font-size:12px;color:var(--muted);text-align:center}
.foot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.foot button{border:0;background:none;color:var(--brand);font-weight:700;cursor:pointer;font-size:12px;padding:0}
.stack{display:flex;flex-direction:column;gap:14px}
.err{margin:0;padding:8px 10px;border-radius:10px;background:var(--bad-bg);color:var(--bad);font-size:13px;font-weight:600}
.linkbtn{border:0;background:none;color:var(--brand);font-weight:700;cursor:pointer;font-size:13px;padding:0}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;min-height:84px;word-break:break-all}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:90vw;z-index:20;box-shadow:0 6px 20px rgba(0,0,0,.25)}
@media (prefers-reduced-motion:no-preference){.card,.screen>*{animation:rise .18s ease-out}@keyframes rise{from{opacity:.4;transform:translateY(4px)}}}
</style>

<div class="wrap">
  <div class="top">
    <div class="brand">
      <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><circle cx="10" cy="14" r="7" fill="none" stroke="var(--brand)" stroke-width="3"/><circle cx="18" cy="14" r="7" fill="none" stroke="var(--accent)" stroke-width="3"/></svg>
      LocaLink
    </div>

</div>

<script>
const SERVICES = {
  'Electrician':['Wiring','Fan & appliance repair','Inverter & UPS','Switchboard'],
  'Plumber':['Leak repair','Pipe fitting','Bathroom fittings','Water tank'],
  'Carpenter':['Furniture repair','Door & window','Modular fitting'],
  'Painter':['Interior','Exterior','Waterproofing'],
  'Cleaner':['Home deep clean','Kitchen','Bathroom'],
  'Gardener':['Lawn care','Plant care','Terrace garden'],
  'Driver':['Local trips','Airport','Outstation'],
  'Domestic help':['Cooking','Daily cleaning','Utensils & laundry'],
  'Caregiver':['Elder care','Patient care','Child care']
};
const AREAS = {'Lakeview Colony':[1,6],'Market Road':[4,5],'Temple Street':[3,2],'Green Park':[7,6],'Station Road':[6,1],'Riverside':[9,3]};
const SLOTS = [
  {id:'td-m',day:'Today',t:'9 AM – 12 PM'},{id:'td-a',day:'Today',t:'12 – 4 PM'},{id:'td-e',day:'Today',t:'4 – 8 PM'},
  {id:'tm-m',day:'Tomorrow',t:'9 AM – 12 PM'},{id:'tm-a',day:'Tomorrow',t:'12 – 4 PM'},{id:'tm-e',day:'Tomorrow',t:'4 – 8 PM'}];
const slotText = id => { const s = SLOTS.find(x => x.id === id); return s ? s.day + ', ' + s.t : id; };
const WLABEL = {skill:'Skill match',loc:'Location',avail:'Availability',exp:'Experience',rel:'Reliability',rate:'Rating'};
const ROLE_TABS = {
  customer:[['find','Find'],['bookings','My bookings']],
  worker:[['requests','Requests'],['schedule','Availability'],['join','Join']],
  admin:[['approvals','Approvals'],['monitor','Bookings'],['complaints','Complaints']]
};

function seed(){
  return {
    workers:[
      {id:1,name:'Ravi Kumar',service:'Electrician',skills:['Wiring','Fan & appliance repair'],area:'Market Road',radius:4,exp:8,rating:4.7,count:31,completed:46,accepted:48,coop:true,status:'approved',slots:['td-a','td-e','tm-m','tm-a']},
      {id:2,name:'Imran Sheikh',service:'Electrician',skills:['Wiring','Inverter & UPS','Switchboard'],area:'Lakeview Colony',radius:5,exp:12,rating:4.5,count:52,completed:88,accepted:94,coop:false,status:'approved',slots:['td-m','td-a','tm-m']},
      {id:3,name:'Prakash N',service:'Electrician',skills:['Fan & appliance repair'],area:'Green Park',radius:3,exp:2,rating:4.8,count:3,completed:5,accepted:5,coop:false,status:'approved',slots:['td-e','tm-a','tm-e']},
      {id:4,name:'Karthik S',service:'Electrician',skills:['Wiring','Fan & appliance repair','Switchboard'],area:'Station Road',radius:4,exp:5,rating:4.2,count:19,completed:25,accepted:31,coop:true,status:'approved',slots:['tm-m','tm-a','tm-e','td-e']},
      {id:5,name:'Anil Das',service:'Plumber',skills:['Leak repair','Pipe fitting'],area:'Temple Street',radius:4,exp:10,rating:4.6,count:40,completed:61,accepted:64,coop:true,status:'approved',slots:['td-a','td-e','tm-m']},
      {id:6,name:'Joseph M',service:'Plumber',skills:['Bathroom fittings','Water tank','Leak repair'],area:'Riverside',radius:5,exp:6,rating:4.4,count:22,completed:30,accepted:35,coop:false,status:'approved',slots:['td-m','tm-a']},
      {id:7,name:'Suresh Rao',service:'Carpenter',skills:['Furniture repair','Door & window'],area:'Market Road',radius:5,exp:14,rating:4.8,count:63,completed:97,accepted:99,coop:true,status:'approved',slots:['td-a','tm-m','tm-a']},
      {id:8,name:'Mohan Lal',service:'Painter',skills:['Interior','Waterproofing'],area:'Green Park',radius:6,exp:9,rating:4.3,count:27,completed:38,accepted:44,coop:false,status:'approved',slots:['tm-m','tm-a']},
      {id:9,name:'Lakshmi Devi',service:'Cleaner',skills:['Home deep clean','Kitchen','Bathroom'],area:'Lakeview Colony',radius:4,exp:7,rating:4.9,count:45,completed:70,accepted:71,coop:true,status:'approved',slots:['td-m','td-a','tm-m']},
      {id:10,name:'Meena K',service:'Domestic help',skills:['Cooking','Daily cleaning'],area:'Temple Street',radius:3,exp:6,rating:4.6,count:34,completed:52,accepted:54,coop:true,status:'approved',slots:['td-m','tm-m']},
      {id:11,name:'Sunita P',service:'Caregiver',skills:['Elder care','Patient care'],area:'Market Road',radius:5,exp:11,rating:4.9,count:29,completed:41,accepted:42,coop:true,status:'approved',slots:['td-a','td-e','tm-a']},
      {id:12,name:'Abdul R',service:'Driver',skills:['Local trips','Airport'],area:'Station Road',radius:8,exp:9,rating:4.5,count:58,completed:90,accepted:96,coop:false,status:'approved',slots:['td-e','tm-m','tm-e']},
      {id:13,name:'Gopal T',service:'Gardener',skills:['Lawn care','Plant care','Terrace garden'],area:'Riverside',radius:6,exp:4,rating:4.1,count:12,completed:18,accepted:22,coop:false,status:'approved',slots:['tm-m','tm-a']},
      {id:14,name:'Vikram T',service:'Electrician',skills:['Wiring'],area:'Riverside',radius:4,exp:3,rating:0,count:0,completed:0,accepted:0,coop:false,status:'pending',slots:['td-a','tm-a'],docs:['ID proof uploaded','ITI Electrician certificate uploaded']},
      {id:15,name:'Farida B',service:'Cleaner',skills:['Home deep clean','Kitchen'],area:'Green Park',radius:4,exp:5,rating:0,count:0,completed:0,accepted:0,coop:true,status:'pending',slots:['td-m','tm-m'],docs:['ID proof uploaded','Cooperative membership letter uploaded']}
    ],
    bookings:[
      {id:1,mine:true,workerId:2,service:'Electrician',skills:['Wiring'],area:'Lakeview Colony',slot:'td-m',address:'House 12, 3rd Cross',note:'Two sockets sparking',status:'completed',rating:null,complaint:null},
      {id:2,mine:false,who:'Neha',workerId:1,service:'Electrician',skills:['Fan & appliance repair'],area:'Green Park',slot:'td-e',address:'Flat 4B, Palm Court',note:'Ceiling fan is noisy',status:'requested',rating:null,complaint:null},
      {id:3,mine:false,who:'Arjun',workerId:1,service:'Electrician',skills:['Wiring'],area:'Market Road',slot:'tm-m',address:'27, Bazaar Lane',note:'New light point in the hall',status:'accepted',rating:null,complaint:null},
      {id:4,mine:false,who:'Divya',workerId:4,service:'Electrician',skills:['Switchboard'],area:'Station Road',slot:'td-a',address:'Shop 6, Station Road',note:'',status:'completed',rating:2,complaint:{text:'Arrived 40 minutes late and did not call.',status:'open'}}
    ],
    nextW:16,nextB:5
  };
}

let D = seed();
const freshUI = () => ({
  role:'customer',tab:'find',cScreen:'form',
  find:{service:'Electrician',skills:[],area:'Market Road',slot:'td-e',details:'',note:''},
  pick:null,workerId:1,
  weights:{skill:25,loc:20,avail:15,exp:10,rel:15,rate:15},
  form:null,rate:0,reg:{name:'',service:'Electrician',skills:[],area:'Market Road',radius:4,exp:2,coop:false,id:true,cert:false,slots:['td-a','tm-a']},
  open:new Set()
});
let ui = freshUI();

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initials = n => n.split(' ').map(p => p[0]).slice(0,2).join('').toUpperCase();
const wById = id => D.workers.find(w => w.id === id);
const dist = (a,b) => Math.hypot(AREAS[a][0]-AREAS[b][0], AREAS[a][1]-AREAS[b][1]) * 0.6;
const reliability = w => w.accepted ? w.completed / w.accepted : 0.8;
const stars = n => '★'.repeat(Math.round(n)) + '☆'.repeat(5 - Math.round(n));
let toastTimer;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 2600); }

/* ---------- matching: filter, then weighted score (components 0-1) ---------- */
function matches(req){
  const out = [];
  for (const w of D.workers){
    if (w.status !== 'approved' || w.service !== req.service) continue;
    const d = dist(w.area, req.area);
    if (d > w.radius) continue;
    const free = w.slots.includes(req.slot);
    const day = req.slot.slice(0,2);
    const alt = w.slots.find(s => s.startsWith(day) && s !== req.slot);
    if (!free && !alt) continue;
    const tags = req.skills;
    const hit = tags.filter(t => w.skills.includes(t)).length;
    const c = {
      skill: tags.length ? 0.4 + 0.6 * hit / tags.length : 0.5 + 0.5 * Math.min(w.skills.length / 3, 1),
      loc: 1 - d / w.radius,
      avail: free ? 1 : 0.5,
      exp: Math.min(w.exp / 10, 1),
      rel: reliability(w),
      rate: w.count >= 5 ? w.rating / 5 : null
    };
    let num = 0, den = 0;
    for (const k in c){ if (c[k] === null) continue; num += ui.weights[k] * c[k]; den += ui.weights[k]; }
    const score = den ? num / den * 100 : 0;
    out.push({w, c, d, free, alt, score, den});
  }
  return out.sort((a,b) => b.score - a.score);
}

/* ---------- views ---------- */
function renderRoles(){
  $('#roles').innerHTML = [['customer','Customer'],['worker','Worker'],['admin','Admin']].map(([r,l]) =>
    `<button type="button" role="tab" aria-selected="${ui.role===r}" data-act="role" data-v="${r}">${l}</button>`).join('');
}
function renderTabs(){
  const pend = D.workers.filter(w => w.status === 'pending').length;
  const openC = D.bookings.filter(b => b.complaint && b.complaint.status === 'open').length;
  const reqs = D.bookings.filter(b => b.workerId === ui.workerId && b.status === 'requested').length;
  const badge = k => (ui.role==='admin' && k==='approvals' && pend) ? pend : (ui.role==='admin' && k==='complaints' && openC) ? openC : (ui.role==='worker' && k==='requests' && reqs) ? reqs : 0;
  $('#tabs').innerHTML = ROLE_TABS[ui.role].map(([k,l]) =>
    `<button type="button" role="tab" aria-selected="${ui.tab===k}" data-act="tab" data-v="${k}">${l}${badge(k)?`<span class="count">${badge(k)}</span>`:''}</button>`).join('');
}

function chips(list, sel, act){
  return `<div class="chips">${list.map(s => `<button type="button" class="chip" aria-pressed="${sel.includes(s)}" data-act="${act}" data-v="${esc(s)}">${esc(s)}</button>`).join('')}</div>`;
}
function slotChips(sel, act, multi){
  return `<div class="slots">${SLOTS.map(s => `<button type="button" class="chip" aria-pressed="${multi ? sel.includes(s.id) : sel===s.id}" data-act="${act}" data-v="${s.id}">${s.day}<small>${s.t}</small></button>`).join('')}</div>`;
}
function opts(list, cur){ return list.map(o => `<option${o===cur?' selected':''}>${esc(o)}</option>`).join(''); }

function viewCustomerFind(){
  const f = ui.find;
  if (ui.cScreen === 'results') return viewResults();

/* ---------- access: main password first, then personal accounts ----------
   Runs entirely in the browser (no server). Passwords are salted and hashed with PBKDF2,
   never stored in plain text. This keeps casual visitors out; it is not bank-grade security. */
const MASTER = {s:'', h:'', n:150000};   // only used when GATE_ENABLED is true   // filled in with the owner's setup code
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } },
  sget(k){ try{ return sessionStorage.getItem(k); }catch(e){ return null; } },
  sset(k,v){ try{ v === null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k,v); }catch(e){} }
};
const canStore = store.set('lk_probe','1');
const GATE_ENABLED = false;   // true = ask for a main password first (create a code on the #setup screen)
const auth = {master: !GATE_ENABLED || store.sget('lk_master') === '1', user: store.sget('lk_user'), mode:'login'};
let setupMode = location.hash === '#setup';

const b64 = u8 => btoa(String.fromCharCode(...u8));
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const hasCrypto = () => !!(window.crypto && crypto.subtle);
async function derive(pw, salt, n){
  const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({name:'PBKDF2', hash:'SHA-256', salt, iterations:n}, key, 256);
  return b64(new Uint8Array(bits));
}
const NOCRYPTO = 'This browser cannot run the secure check. Please open the link in Chrome or Safari.';
const keyOf = n => n.trim().toLowerCase();
const usersLoad = () => { try{ return JSON.parse(store.get('lk_users_v1') || '{}'); }catch(e){ return {}; } };
const usersSave = u => store.set('lk_users_v1', JSON.stringify(u));
const userName = () => (usersLoad()[auth.user] || {}).name || 'You';
const saveData = () => { if (auth.user) store.set('lk_data_' + auth.user, JSON.stringify(D)); };
function loadData(){
  try{ const raw = store.get('lk_data_' + auth.user); const d = raw && JSON.parse(raw);
    if (d && Array.isArray(d.workers) && Array.isArray(d.bookings)) return d; }catch(e){}
  return seed();
}
function startSession(k){ auth.user = k; store.sset('lk_user', k); D = loadData(); ui = freshUI(); }
const wait = ms => new Promise(r => setTimeout(r, ms));

async function doUnlock(pw){
  if (!MASTER.h) return 'Access has not been opened yet. Please ask the LocaLink team.';
  if (!hasCrypto()) return NOCRYPTO;
  const h = await derive(pw, unb64(MASTER.s), MASTER.n);
  if (h !== MASTER.h){ await wait(700); return 'That main password is not correct.'; }
  auth.master = true; store.sset('lk_master', '1'); auth.mode = 'login'; return '';
}
async function doSignup(name, pw, pw2){
  name = name.trim().replace(/\s+/g, ' ');
  if (name.length < 2 || name.length > 30) return 'Enter a name of 2 to 30 characters.';
  if (pw.length < 6) return 'Use at least 6 characters for your password.';
  if (pw !== pw2) return 'The two passwords do not match.';
  if (!canStore) return 'This browser blocks saving, so accounts cannot be created. Try a normal, non-private window.';
  if (!hasCrypto()) return NOCRYPTO;
  const users = usersLoad(), k = keyOf(name);
  if (users[k]) return 'That name is already taken. Pick another, or log in.';
  const salt = crypto.getRandomValues(new Uint8Array(16));
  users[k] = {name, s:b64(salt), h:await derive(pw, salt, 150000), n:150000};
  if (!usersSave(users)) return 'Could not save your account in this browser.';
  startSession(k); return '';
}
async function doLogin(name, pw){
  if (!hasCrypto()) return NOCRYPTO;
  const u = usersLoad()[keyOf(name)];
  if (!u){ await wait(700); return 'Name or password is incorrect.'; }
  if (await derive(pw, unb64(u.s), u.n) !== u.h){ await wait(700); return 'Name or password is incorrect.'; }
  startSession(keyOf(name)); return '';
}

async function doSetup(pw){
  if (!hasCrypto()) return NOCRYPTO;
  if (pw.length < 8) return 'Use at least 8 characters.';
  const salt = crypto.getRandomValues(new Uint8Array(16)), n = 150000;
  const code = JSON.stringify({s:b64(salt), h:await derive(pw, salt, n), n});
  $('#s-code').value = code; $('#setup-out').hidden = false; return '';
}

/* ---------- events ---------- */
const setPath = (path, val) => { const p = path.split('.'); let o = ui; while (p.length > 1) o = o[p.shift()]; o[p[0]] = val; };
const toggle = (arr, v) => { const i = arr.indexOf(v); i < 0 ? arr.push(v) : arr.splice(i, 1); };

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, v = el.dataset.v, id = +v;
  const bk = () => D.bookings.find(b => b.id === id);
  switch (a){
    case 'role': ui.role = v; ui.tab = ROLE_TABS[v][0][0]; ui.form = null; break;
    case 'tab': ui.tab = v; ui.form = null; if (ui.role==='customer' && v==='find') ui.cScreen = 'form'; break;
    case 'skill': toggle(ui.find.skills, v); break;
    case 'slot': ui.find.slot = v; break;
    case 'search': ui.cScreen = 'results'; break;
    case 'back': ui.cScreen = ui.cScreen === 'confirm' ? 'results' : 'form'; break;
    case 'pick': ui.pick = id; ui.cScreen = 'confirm'; break;
    case 'send': {
      const f = ui.find;
      D.bookings.push({id:D.nextB++,mine:true,workerId:ui.pick,service:f.service,skills:[...f.skills],area:f.area,slot:f.slot,address:f.details,note:f.note,status:'requested',rating:null,complaint:null});
      toast('Request sent to ' + wById(ui.pick).name); ui.tab = 'bookings'; ui.cScreen = 'form'; break; }
    case 'cancel': bk().status = 'cancelled'; toast('Booking cancelled'); break;
    case 'refind': { const b = bk(); ui.find = {...ui.find, service:b.service, skills:[...b.skills], area:b.area, slot:b.slot}; ui.tab = 'find'; ui.cScreen = 'results'; break; }
    case 'openform': ui.form = v; ui.rate = 0; break;
    case 'star': ui.rate = id; break;
    case 'submitrate': {
      if (!ui.rate){ toast('Choose 1 to 5 stars first'); return; }
      const b = bk(), w = wById(b.workerId);
      w.rating = (w.rating * w.count + ui.rate) / (w.count + 1); w.count += 1; b.rating = ui.rate; ui.form = null;
      toast('Thanks. Rating saved for ' + w.name); break; }
    case 'submitrep': {
      const t = ($('#rep-text').value || '').trim(); if (!t){ toast('Describe the problem first'); return; }
      bk().complaint = {text:t, status:'open'}; ui.form = null; toast('Sent to the admin team'); break; }
    case 'accept': { const b = bk(); b.status = 'accepted'; wById(b.workerId).accepted += 1; toast('Accepted. Address is now visible'); break; }
    case 'decline': bk().status = 'declined'; toast('Request declined'); break;
    case 'complete': { const b = bk(); b.status = 'completed'; wById(b.workerId).completed += 1; toast('Marked completed. Customer can now rate'); break; }
    case 'toggleslot': { const w = wById(ui.workerId); toggle(w.slots, v); break; }
    case 'regskill': toggle(ui.reg.skills, v); break;
    case 'regslot': toggle(ui.reg.slots, v); break;
    case 'regflag': ui.reg[v] = !ui.reg[v]; break;
    case 'register': {
      const r = ui.reg; if (!r.name.trim()){ toast('Enter your name first'); return; }
      if (!r.skills.length){ toast('Pick at least one skill'); return; }
      const docs = []; if (r.id) docs.push('ID proof uploaded'); if (r.cert) docs.push('Skill certificate uploaded'); if (r.coop) docs.push('Cooperative membership letter uploaded');
      D.workers.push({id:D.nextW++,name:r.name.trim(),service:r.service,skills:[...r.skills],area:r.area,radius:Math.max(1,+r.radius||3),exp:Math.max(0,+r.exp||0),rating:0,count:0,completed:0,accepted:0,coop:r.coop,status:'pending',slots:[...r.slots],docs});
      ui.reg = {name:'',service:'Electrician',skills:[],area:'Market Road',radius:4,exp:2,coop:false,id:true,cert:false,slots:['td-a','tm-a']};
      toast('Submitted. Switch to Admin to approve it'); break; }
    case 'approve': { const w = wById(id); w.status = 'approved'; toast(w.name + ' approved and now visible to customers'); break; }
    case 'reject': { D.workers = D.workers.filter(w => w.id !== id); toast('Profile rejected'); break; }
    case 'resolve': bk().complaint.status = 'resolved'; toast('Complaint resolved'); break;
    case 'authmode': auth.mode = v; break;
    case 'logout': auth.user = null; auth.mode = 'login'; store.sset('lk_user', null); break;
    case 'exitsetup': setupMode = false; break;
    case 'opensetup': setupMode = true; break;
    case 'copycode': {
      const ta = $('#s-code'); ta.select();
      try{ navigator.clipboard.writeText(ta.value).then(() => toast('Code copied'), () => toast('Press and hold the code to copy it')); }
      catch(err){ toast('Press and hold the code to copy it'); }
      return; }
    case 'reset': D = seed(); ui.cScreen = 'form'; ui.form = null; toast('Demo reset'); break;
  }
  render();
});

document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.w){ ui.weights[t.dataset.w] = +t.value;
    const total = Object.values(ui.weights).reduce((a,b) => a+b, 0) || 1;
    for (const k in ui.weights){ const n = $('#wv-' + k); if (n) n.textContent = Math.round(ui.weights[k]/total*100) + '%'; }
    $('#resultsList').innerHTML = resultCards(matches(ui.find)); return; }
  if (t.dataset.bind && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) setPath(t.dataset.bind, t.value);
});
document.addEventListener('change', e => {
  const t = e.target; if (!t.dataset.bind || t.tagName !== 'SELECT') return;
  const path = t.dataset.bind;
  setPath(path, path === 'workerId' ? +t.value : t.value);
  if (path === 'find.service') ui.find.skills = [];
  if (path === 'reg.service') ui.reg.skills = [];
  render();
});
document.addEventListener('toggle', e => {
  const k = e.target.dataset && e.target.dataset.key; if (!k) return;
  e.target.open ? ui.open.add(k) : ui.open.delete(k);
}, true);

document.addEventListener('submit', async e => {
  const f = e.target.closest('[data-form]'); if (!f) return;
  e.preventDefault();
  const kind = f.dataset.form, btn = f.querySelector('button[type=submit]'), err = f.querySelector('.err');
  const val = id => (f.querySelector('#' + id) || {}).value || '';
  btn.disabled = true; err.hidden = true;
  let msg = '';
  try{
    if (kind === 'master') msg = await doUnlock(val('m-pw'));
    else if (kind === 'login') msg = await doLogin(val('a-name'), val('a-pw'));
    else if (kind === 'signup') msg = await doSignup(val('a-name'), val('a-pw'), val('a-pw2'));
    else if (kind === 'setup'){ msg = await doSetup(val('s-pw')); btn.disabled = false; if (msg){ err.textContent = msg; err.hidden = false; } return; }
  }catch(ex){ msg = 'Something went wrong. Please try again.'; }
  if (msg){ err.textContent = msg; err.hidden = false; btn.disabled = false; return; }
  render();
});

if (auth.user && usersLoad()[auth.user]) D = loadData(); else auth.user = null;
render();
</script>
